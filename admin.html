<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>담당자 관리 | ㈜화신 현장실습 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
:root{
  --navy:#0B0F1A;--navy2:#121A2F;--blue:#1A56FF;--blue2:#E8EEFF;
  --green:#0AA65B;--green2:#E6F9F0;--red:#D92B2B;--red2:#FEF0F0;
  --amber:#D97706;--amber2:#FFF7E6;--gray50:#F6F7F9;--gray100:#EDEEF2;
  --gray200:#D8DAE0;--gray400:#9EA4B0;--gray600:#5E6478;--gray800:#2C3042;
  --white:#fff;--shadow:0 12px 40px rgba(11,15,26,.10);--radius:22px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'DM Serif Display',Georgia,serif;--mono:'IBM Plex Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--gray600);background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.container{max-width:1160px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:50;height:64px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--gray100);backdrop-filter:blur(16px)}
.nav-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--navy)}
.logo-img{display:block;height:28px;width:auto;max-width:190px}
.logo-badge{font-size:10px;letter-spacing:.08em;background:var(--navy);color:#fff;padding:4px 8px;border-radius:6px}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none}
.nav-links a{font-size:14px;color:var(--gray600);font-weight:600}
.nav-links a:hover{color:var(--blue)}
.nav-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:99px;border:1px solid transparent;font-weight:800;font-size:14px;cursor:pointer;transition:.16s;font-family:var(--font)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:#0038CC;transform:translateY(-1px)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--gray200)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue);background:var(--blue2)}
.btn.warn{background:var(--amber);color:#fff}
.btn.small{height:38px;padding:0 16px;font-size:13px}
.hero{background:radial-gradient(circle at top right,rgba(26,86,255,.28),transparent 36%),linear-gradient(160deg,var(--navy),#111932);color:#fff;padding:92px 0 80px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:56px;align-items:center}
.eyebrow,.section-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;border-radius:99px;padding:6px 12px}
.eyebrow{background:rgba(26,86,255,.18);border:1px solid rgba(127,168,255,.28);color:#8CB0FF;margin-bottom:22px}
.eyebrow:before,.section-tag:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hero h1{font-family:var(--display);font-size:clamp(42px,5.2vw,70px);font-weight:400;line-height:1.06;margin-bottom:22px}
.hero h1 em{color:#86AAFF;font-style:italic}
.hero p{color:rgba(255,255,255,.66);font-size:16px;max-width:560px}
.hero-cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:34px}
.note{font-size:13px;color:rgba(255,255,255,.46)}
.note strong{color:#FFB86B}
.card{background:#fff;border:1px solid var(--gray100);border-radius:var(--radius);box-shadow:0 2px 18px rgba(11,15,26,.06)}
.dark-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.16)}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.metric{background:rgba(0,0,0,.22);border-radius:14px;padding:16px}
.metric-label{font-size:12px;color:rgba(255,255,255,.42);margin-bottom:5px}
.metric-val{font-size:19px;color:#fff;font-weight:900}
.banner{background:var(--amber2);border-top:2px solid var(--amber);border-bottom:1px solid #F4DEAF;padding:14px 0}
.banner .container{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--gray800)}
.icon-dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--amber);color:#fff;font-weight:900;flex:0 0 auto}
section{padding:84px 0}
.section-head{max-width:680px}
.section-tag{background:var(--blue2);color:var(--blue);margin-bottom:16px}
.section-head h2{font-family:var(--display);font-size:clamp(32px,4.4vw,50px);line-height:1.1;font-weight:400;color:var(--navy);margin-bottom:14px}
.section-head p{font-size:15px;color:var(--gray600)}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--gray200);border:1px solid var(--gray200);border-radius:var(--radius);overflow:hidden;margin-top:48px}
.overview-item{background:#fff;padding:32px 24px;text-align:center}
.num{font-family:var(--mono);font-size:38px;color:var(--navy);line-height:1;margin-bottom:9px}
.num span{font-size:20px;color:var(--blue)}
.label{font-weight:900;color:var(--gray800);font-size:13px;margin-bottom:4px}
.desc{font-size:12px;color:var(--gray400)}
.gray{background:var(--gray50)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.feature{background:#fff;border:1px solid var(--gray100);border-radius:var(--radius);padding:30px;transition:.16s}
.feature:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.feature-icon{width:46px;height:46px;border-radius:14px;background:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:18px}
.feature h3{font-size:18px;color:var(--navy);margin-bottom:8px}
.feature p{font-size:14px;color:var(--gray600)}
.timeline-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:48px}
.step{background:#fff;border:1px solid var(--gray100);border-radius:var(--radius);padding:26px;position:relative}
.step-num{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;margin-bottom:18px}
.step h3{font-size:17px;color:var(--navy);margin-bottom:8px}
.step p{font-size:14px;color:var(--gray600)}
.date{display:inline-block;margin-top:16px;border:1px solid var(--gray200);background:var(--gray50);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--gray800);font-family:var(--mono)}
.notice-card{padding:32px;border-radius:var(--radius);border:1px solid var(--gray100);background:#fff;box-shadow:0 2px 18px rgba(11,15,26,.06)}
.notice-card h3{font-size:20px;color:var(--navy);margin-bottom:10px}
.notice-card p{font-size:14px;color:var(--gray600);margin-bottom:18px}
.notice-list{display:grid;gap:12px;list-style:none}
.notice-list li{display:flex;gap:10px;font-size:14px;color:var(--gray800)}
.check{width:21px;height:21px;border-radius:50%;background:var(--green2);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex:0 0 auto;margin-top:1px}
.form-wrap{max-width:780px;margin:0 auto}
.form-panel{background:#fff;border:1px solid var(--gray100);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:900;color:var(--gray800);letter-spacing:.04em;margin-bottom:8px}
.input,select,textarea{width:100%;border:1px solid var(--gray200);border-radius:12px;height:46px;padding:0 14px;font-family:var(--font);font-size:14px;color:var(--navy);outline:none;background:#fff}
textarea{height:96px;padding:12px 14px;resize:vertical}
.input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,255,.10)}
.help{font-size:12px;color:var(--gray400);margin-top:6px}
.result-box{display:none;margin-top:24px;border-radius:18px;padding:24px;border:1px solid var(--gray100);background:var(--gray50)}
.result-box.show{display:block}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:900;margin-bottom:12px}
.badge.green{background:var(--green2);color:var(--green)}
.badge.red{background:var(--red2);color:var(--red)}
.badge.amber{background:var(--amber2);color:var(--amber)}
.badge.blue{background:var(--blue2);color:var(--blue)}
.result-title{font-size:24px;color:var(--navy);font-weight:900;margin-bottom:8px}
.result-message{font-size:15px;color:var(--gray600);margin-bottom:18px}
.info-table{width:100%;border-collapse:collapse;margin-top:12px}
.info-table th,.info-table td{text-align:left;border-bottom:1px solid var(--gray100);padding:10px 4px;font-size:13px}
.info-table th{color:var(--gray400);width:150px;font-weight:900}
.info-table td{color:var(--gray800)}
.admin-layout{display:block}
.admin-workspace{display:grid;grid-template-columns:minmax(360px,.88fr) minmax(520px,1.12fr);gap:24px;align-items:start}
.admin-settings{display:grid;grid-template-columns:minmax(320px,.92fr) minmax(320px,1.08fr);gap:20px;margin-top:24px}
.admin-settings .form-panel{height:100%}
.panel-scroll{max-height:calc(100vh - 110px);overflow:auto}
.sidebar{position:static}
.table-wrap{overflow:hidden;border:1px solid var(--gray100);border-radius:18px;background:#fff}
.data-table{width:100%;border-collapse:collapse;table-layout:fixed}
.data-table th,.data-table td{border-bottom:1px solid var(--gray100);padding:10px 8px;text-align:left;font-size:12px;vertical-align:middle;word-break:keep-all}
.data-table th{background:var(--gray50);color:var(--gray800);font-weight:900;position:sticky;top:0}
.data-table td{color:var(--gray600);overflow:hidden;text-overflow:ellipsis}
.data-table .col-univ{width:16%}.data-table .col-name{width:13%}.data-table .col-type{width:13%}.data-table .col-field{width:16%}.data-table .col-stage{width:15%}.data-table .col-interview{width:15%}.data-table .col-edit{width:12%}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.import-control{position:relative;overflow:hidden}
.import-control input{position:absolute;inset:0;opacity:0;cursor:pointer}
.footer{background:#fff;border-top:1px solid var(--gray100);padding:42px 0;color:var(--gray400);font-size:12px}
.hidden{display:none!important}
.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:none;z-index:90;font-size:13px;max-width:360px}
.toast.show{display:block}
@media(max-width:960px){
  .nav-links{display:none}.hero-grid,.admin-workspace,.admin-settings{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr 1fr}.grid-3,.timeline-grid{grid-template-columns:1fr 1fr}.sidebar{position:static}.panel-scroll{max-height:none}
}
@media(max-width:640px){
  .container{padding:0 18px}.hero{padding:64px 0}.hero h1{font-size:38px}.grid-4,.grid-3,.timeline-grid,.form-grid{grid-template-columns:1fr}.nav-actions .ghost{display:none}
  section{padding:64px 0}
}
</style>
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo" aria-label="HWASHIN 메인페이지"><img class="logo-img" src="assets/hwashin-logo.svg" alt="HWASHIN"></a>
      <ul class="nav-links">
        <li><a href="index.html">랜딩</a></li>
        <li><a href="result.html">학생 조회</a></li>
      </ul>
      <div class="nav-actions">
        <a class="btn ghost small" href="result.html">조회 페이지</a>
      </div>
    </div>
  </nav>

  <header class="hero" style="padding:64px 0 56px">
    <div class="container">
      <div class="eyebrow">Admin Console</div>
      <h1 style="max-width:780px">대학별 지원자<br><em>등록·합격 처리</em></h1>
      <p>대학별로 접수된 이력서를 확인한 뒤 지원자 정보를 등록하고 서류합격·최종합격 안내문을 제어합니다.</p>
    </div>
  </header>

  <section>
    <div class="container admin-layout">
      <main class="admin-workspace">
        <div class="form-panel panel-scroll">
          <div class="section-tag">APPLICANT FORM</div>
          <h2 style="font-family:var(--display);font-weight:400;color:var(--navy);font-size:34px;line-height:1.1;margin-bottom:18px">지원자 등록 / 수정</h2>

          <div class="form-grid">
            <div class="field"><label>대학교 *</label><input class="input" id="university" placeholder="영남대학교"></div>
            <div class="field"><label>이름 *</label><input class="input" id="name" placeholder="홍길동"></div>
            <div class="field"><label>생년월일 *</label><input class="input" id="birthDate" placeholder="2004-01-01" inputmode="numeric"></div>
            <div class="field"><label>연락처</label><input class="input" id="phone" placeholder="010-0000-0000"></div>
            <div class="field"><label>이메일</label><input class="input" id="email" placeholder="student@univ.ac.kr"></div>
            <div class="field"><label>전공</label><input class="input" id="major" placeholder="컴퓨터공학과"></div>
            <div class="field">
              <label>인턴 유형 *</label>
              <select id="internshipType" onchange="updateFieldOptions()">
                <option value="채용연계형">채용연계형</option>
                <option value="체험형">체험형</option>
              </select>
            </div>
            <div class="field">
              <label>지원 분야 *</label>
              <select id="field">
                <option value="">선택</option>
              </select>
            </div>
            <div class="field">
              <label>전형 단계 *</label>
              <select id="currentStage" onchange="applyNoticeTemplate()">
                <option value="REVIEWING">검토 중</option>
                <option value="DOCUMENT_PASS">서류합격</option>
                <option value="DOCUMENT_FAIL">서류불합격</option>
                <option value="FINAL_PASS">최종합격</option>
                <option value="FINAL_FAIL">최종불합격</option>
              </select>
            </div>
            <div class="field"><label>면접일자</label><input class="input" id="interviewDate" placeholder="2026-06-24 14:00"></div>
          </div>

          <div class="field">
            <label>안내문 제목</label>
            <input class="input" id="noticeTitle">
          </div>
          <div class="field">
            <label>안내문 본문</label>
            <textarea id="noticeBody"></textarea>
          </div>
          <div class="form-grid">
            <div class="field">
              <label>제출 서류 안내</label>
              <textarea id="requiredDocuments" placeholder="재학증명서, 통장사본, 신분증 사본, 보안서약서 등 (학생이 제출해야 할 서류 목록)"></textarea>
            </div>
            <div class="field">
              <label>제출 기한 / 요청사항</label>
              <textarea id="requestItems" placeholder="제출기한: 2026-07-02 17:00 / 제출처: ji-suk.kim@hwashin.co.kr / 오리엔테이션 일정 별도 안내"></textarea>
            </div>
          </div>
          <div class="field">
            <label>담당자 메모</label>
            <textarea id="memo" placeholder="내부 관리용 메모 (학생에게 노출되지 않음)"></textarea>
          </div>

          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn primary" onclick="saveApplicant()">저장 / 수정 →</button>
            <button class="btn ghost" onclick="resetForm()">신규 입력</button>
            <button class="btn ghost" onclick="loadApplicants()">목록 새로고침</button>
          </div>
        </div>

        <div class="form-panel panel-scroll">
          <div class="toolbar">
            <div>
              <div class="section-tag" style="margin-bottom:8px">APPLICANT LIST</div>
              <h2 style="font-family:var(--display);font-weight:400;color:var(--navy);font-size:30px;line-height:1.1">지원자 목록</h2>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <label class="btn dark small import-control">CSV/XLSX 불러오기<input id="importFile" type="file" accept=".csv,.xlsx,.xls" onchange="importApplicantsFromFile(event)"></label>
              <button class="btn ghost small" onclick="exportCsv()">CSV 내보내기</button>
              <button class="btn warn small" onclick="seedDemo()">데모 데이터 생성</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="col-univ">대학교</th><th class="col-name">이름</th><th class="col-type">유형</th><th class="col-field">지원분야</th><th class="col-stage">전형단계</th><th class="col-interview">면접일자</th><th class="col-edit">수정</th>
                </tr>
              </thead>
              <tbody id="applicantRows"></tbody>
            </table>
          </div>
        </div>
      </main>

      <div class="admin-settings">
        <div class="form-panel">
          <div class="section-tag">API SETUP</div>
          <h2 style="font-family:var(--display);font-weight:400;color:var(--navy);font-size:30px;line-height:1.15;margin-bottom:10px">Google Sheets 연결</h2>
          <p class="help" style="margin-bottom:18px">Netlify Function API 경로와 관리자 키를 입력합니다. 비워두면 데모 모드로 동작합니다.</p>
          <div class="form-grid">
            <div class="field">
              <label>Netlify Function API URL</label>
              <input class="input" id="apiEndpoint" placeholder="/.netlify/functions/api">
            </div>
            <div class="field">
              <label>관리자 키</label>
              <input class="input" id="adminKey" type="password" placeholder="Netlify ADMIN_KEY">
            </div>
          </div>
          <button class="btn dark small" onclick="saveApiConfig()">설정 저장</button>
          <button class="btn ghost small" onclick="clearApiConfig()">초기화</button>
        </div>

        <div class="form-panel">
          <div class="section-tag">FILTER</div>
          <div class="form-grid">
            <div class="field">
              <label>대학교 필터</label>
              <input class="input" id="filterUniv" placeholder="예: 영남대학교" oninput="renderTable()">
            </div>
            <div class="field">
              <label>전형 단계 필터</label>
              <select id="filterStage" onchange="renderTable()">
                <option value="">전체</option>
                <option value="REVIEWING">검토 중</option>
                <option value="DOCUMENT_PASS">서류합격</option>
                <option value="DOCUMENT_FAIL">서류불합격</option>
                <option value="FINAL_PASS">최종합격</option>
                <option value="FINAL_FAIL">최종불합격</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script>
    let API_ENDPOINT = localStorage.getItem('HWASHIN_API_ENDPOINT') || "/.netlify/functions/api";
    let ADMIN_KEY = localStorage.getItem('HWASHIN_ADMIN_KEY') || "";
    let applicants = JSON.parse(localStorage.getItem('HWASHIN_DEMO_APPLICANTS') || '[]');
    const FIELD_OPTIONS = {
      '채용연계형': ['생산기술','품질','마케팅','기획','인사','해외물류'],
      '체험형': ['연구소']
    };

    const NOTICE_TEMPLATES = {
      REVIEWING: {
        title:'전형 결과 검토 중',
        body:'현재 지원자님의 전형 결과를 검토 중입니다. 결과가 확정되면 본 페이지를 통해 안내드리겠습니다.',
        docs:'', req:''
      },
      DOCUMENT_PASS: {
        title:'서류전형 합격 및 면접 참석 확인 요청',
        body:'서류전형에 합격하셨습니다. 아래 면접 일정을 확인한 뒤 참석 가능 여부를 회신해 주세요.',
        docs:'',
        req:'면접 참석 가능 여부 회신 / 일정 조율 필요 시 사유 기재'
      },
      DOCUMENT_FAIL: {
        title:'서류전형 결과 안내',
        body:'현장실습 서류전형 결과 아쉽게도 이번 전형에서는 함께하지 못하게 되었습니다. 지원해 주셔서 감사합니다.',
        docs:'', req:''
      },
      FINAL_PASS: {
        title:'최종합격 및 입사 준비서류 안내',
        body:'최종합격을 축하드립니다. 아래 준비서류와 요청사항을 기한 내 제출해 주세요.',
        docs:'재학증명서, 통장사본, 신분증 사본, 보안서약서, 개인정보 수집·이용 동의서',
        req:'제출기한: 2026-07-02 17:00 / 제출처: ji-suk.kim@hwashin.co.kr / 오리엔테이션 일정 별도 안내'
      },
      FINAL_FAIL: {
        title:'최종전형 결과 안내',
        body:'최종전형 결과 아쉽게도 이번 현장실습에는 함께하지 못하게 되었습니다. 관심을 가져주셔서 감사합니다.',
        docs:'', req:''
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('apiEndpoint').value = API_ENDPOINT;
      document.getElementById('adminKey').value = ADMIN_KEY;
      updateFieldOptions();
      applyNoticeTemplate();
      renderTable();
      if(API_ENDPOINT && ADMIN_KEY) loadApplicants();
    });

    function saveApiConfig(){
      API_ENDPOINT = document.getElementById('apiEndpoint').value.trim();
      ADMIN_KEY = document.getElementById('adminKey').value.trim();
      localStorage.setItem('HWASHIN_API_ENDPOINT', API_ENDPOINT);
      localStorage.setItem('HWASHIN_ADMIN_KEY', ADMIN_KEY);
      showToast('연동 설정을 저장했습니다.');
    }
    function clearApiConfig(){
      localStorage.removeItem('HWASHIN_API_ENDPOINT');
      localStorage.removeItem('HWASHIN_ADMIN_KEY');
      API_ENDPOINT = '/.netlify/functions/api'; ADMIN_KEY = '';
      document.getElementById('apiEndpoint').value = API_ENDPOINT;
      document.getElementById('adminKey').value = '';
      showToast('연동 설정을 초기화했습니다. 데모 모드로 동작합니다.');
    }

    function normalizeBirth(v){
      const only = String(v || '').replace(/[^0-9]/g,'');
      if(only.length !== 8) return String(v || '').trim();
      return `${only.slice(0,4)}-${only.slice(4,6)}-${only.slice(6,8)}`;
    }
    function makeId(name, birthDate){ return `${normalizeName(name)}_${normalizeBirth(birthDate)}`; }
    function normalizeName(v){ return String(v || '').replace(/\s/g,'').trim(); }
    function normalizeInternshipType(v){
      const value = String(v || '').trim();
      if(value.includes('체험')) return '체험형';
      return '채용연계형';
    }
    function normalizeStage(v){
      const value = String(v || '').trim().toUpperCase();
      const compact = value.replace(/\s/g, '');
      if(['DOCUMENT_PASS','서류합격'].includes(value) || compact === '서류합격') return 'DOCUMENT_PASS';
      if(['DOCUMENT_FAIL','서류불합격','서류불합'].includes(value) || compact === '서류불합격') return 'DOCUMENT_FAIL';
      if(['FINAL_PASS','최종합격'].includes(value) || compact === '최종합격') return 'FINAL_PASS';
      if(['FINAL_FAIL','최종불합격','최종불합'].includes(value) || compact === '최종불합격') return 'FINAL_FAIL';
      return value === 'REVIEWING' ? 'REVIEWING' : 'REVIEWING';
    }
    function updateFieldOptions(selectedValue){
      const type = normalizeInternshipType(document.getElementById('internshipType')?.value);
      const fieldSelect = document.getElementById('field');
      if(!fieldSelect) return;
      const current = selectedValue || fieldSelect.value;
      const options = FIELD_OPTIONS[type] || FIELD_OPTIONS['채용연계형'];
      fieldSelect.innerHTML = '<option value="">선택</option>' + options.map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join('');
      fieldSelect.value = options.includes(current) ? current : (options.length === 1 ? options[0] : '');
    }

    function applyNoticeTemplate(){
      const stage = document.getElementById('currentStage').value;
      const t = NOTICE_TEMPLATES[stage] || NOTICE_TEMPLATES.REVIEWING;
      if(!document.getElementById('noticeTitle').value || confirm('선택한 전형 단계의 기본 안내문으로 교체할까요?')){
        document.getElementById('noticeTitle').value = t.title;
        document.getElementById('noticeBody').value = t.body;
        document.getElementById('requiredDocuments').value = t.docs;
        document.getElementById('requestItems').value = t.req;
      }
    }

    function getFormData(){
      const data = {
        id: makeId(document.getElementById('name').value, document.getElementById('birthDate').value),
        university: val('university'), name: val('name'), birthDate: normalizeBirth(val('birthDate')),
        phone: val('phone'), email: val('email'), major: val('major'), internshipType: val('internshipType'), field: val('field'),
        currentStage: val('currentStage'), interviewDate: val('interviewDate'), interviewPlace: '',
        noticeTitle: val('noticeTitle'), noticeBody: val('noticeBody'),
        requiredDocuments: val('requiredDocuments'), requestItems: val('requestItems'), memo: val('memo'),
        updatedAt: new Date().toISOString()
      };
      data.documentStatus = data.currentStage === 'DOCUMENT_PASS' || data.currentStage === 'FINAL_PASS' || data.currentStage === 'FINAL_FAIL' ? 'PASS' :
                            data.currentStage === 'DOCUMENT_FAIL' ? 'FAIL' : 'WAITING';
      data.finalStatus = data.currentStage === 'FINAL_PASS' ? 'PASS' :
                         data.currentStage === 'FINAL_FAIL' ? 'FAIL' : 'WAITING';
      return data;
    }
    function val(id){ return document.getElementById(id).value.trim(); }

    async function saveApplicant(){
      const data = getFormData();
      
      // 필수 필드 검증
      if(!data.university || !data.name || !data.birthDate || !data.internshipType || !data.field || !data.currentStage){
        showToast('대학교, 이름, 생년월일, 인턴 유형, 지원 분야, 전형 단계는 필수입니다.');
        return;
      }
      
      // 생년월일 형식 검증
      if(!/^\d{4}-\d{2}-\d{2}$/.test(data.birthDate)){
        showToast('생년월일은 YYYY-MM-DD 형식이어야 합니다.');
        return;
      }
      
      // 이메일 형식 검증 (선택사항이지만 입력 시 확인)
      if(data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){
        showToast('올바른 이메일 형식을 입력해 주세요.');
        return;
      }
      
      // 전화번호 형식 검증 (선택사항)
      if(data.phone && !/^[\d\-\+\s\(\)]*$/.test(data.phone)){
        showToast('전화번호는 숫자와 기호(-,+,(),공백)만 입력 가능합니다.');
        return;
      }
      
      if(API_ENDPOINT && ADMIN_KEY){
        const res = await callApi({action:'upsert', key:ADMIN_KEY, payload:data}, 'POST');
        if(!res.ok) return showToast(res.message || '저장에 실패했습니다.');
        showToast('Google Sheets에 저장했습니다.');
        await loadApplicants();
      } else {
        const idx = applicants.findIndex(a => a.id === data.id);
        if(idx >= 0) applicants[idx] = {...applicants[idx], ...data};
        else applicants.push(data);
        localStorage.setItem('HWASHIN_DEMO_APPLICANTS', JSON.stringify(applicants));
        showToast('데모 목록에 저장했습니다.');
        renderTable();
      }
    }

    async function loadApplicants(){
      if(API_ENDPOINT && ADMIN_KEY){
        const res = await callApi({action:'list', key:ADMIN_KEY});
        if(!res.ok) return showToast(res.message || '목록 조회에 실패했습니다.');
        applicants = res.applicants || [];
      } else {
        applicants = JSON.parse(localStorage.getItem('HWASHIN_DEMO_APPLICANTS') || '[]');
      }
      renderTable();
    }

    function renderTable(){
      const univFilter = normalizeName(document.getElementById('filterUniv')?.value || '');
      const stageFilter = document.getElementById('filterStage')?.value || '';
      const rows = applicants.filter(a => {
        const okUniv = !univFilter || normalizeName(a.university).includes(univFilter);
        const okStage = !stageFilter || a.currentStage === stageFilter;
        return okUniv && okStage;
      });
      const tbody = document.getElementById('applicantRows');
      tbody.innerHTML = rows.length ? rows.map(a => `
        <tr>
          <td>${escapeHtml(a.university)}</td>
          <td><strong style="color:var(--navy)">${escapeHtml(a.name)}</strong></td>
          <td>${escapeHtml(a.internshipType || '채용연계형')}</td>
          <td>${escapeHtml(a.field || '')}</td>
          <td>${stageBadge(a.currentStage)}</td>
          <td>${escapeHtml(a.interviewDate || '')}</td>
          <td><button class="btn ghost small" onclick="editApplicant('${escapeJs(a.id)}')">수정</button></td>
        </tr>`).join('') : `<tr><td colspan="7" style="text-align:center;color:var(--gray400);padding:30px">등록된 지원자가 없습니다.</td></tr>`;
    }

    function editApplicant(id){
      const a = applicants.find(x => x.id === id);
      if(!a) return;
      document.getElementById('internshipType').value = normalizeInternshipType(a.internshipType);
      updateFieldOptions(a.field || '');
      ['university','name','birthDate','phone','email','major','field','currentStage','interviewDate','noticeTitle','noticeBody','requiredDocuments','requestItems','memo'].forEach(k => {
        const el = document.getElementById(k);
        if(el) el.value = a[k] || '';
      });
      window.scrollTo({top: 280, behavior:'smooth'});
    }

    function resetForm(){
      ['university','name','birthDate','phone','email','major','field','interviewDate','noticeTitle','noticeBody','requiredDocuments','requestItems','memo'].forEach(k => {
        const el = document.getElementById(k); if(el) el.value = '';
      });
      document.getElementById('internshipType').value = '채용연계형';
      updateFieldOptions();
      document.getElementById('currentStage').value = 'REVIEWING';
      applyNoticeTemplate();
    }

    function seedDemo(){
      applicants = [
        {id:'홍길동_2004-01-01', university:'영남대학교', name:'홍길동', birthDate:'2004-01-01', major:'컴퓨터공학과', internshipType:'채용연계형', field:'생산기술', currentStage:'DOCUMENT_PASS', documentStatus:'PASS', finalStatus:'WAITING', interviewDate:'2026-06-24 14:00', noticeTitle:NOTICE_TEMPLATES.DOCUMENT_PASS.title, noticeBody:NOTICE_TEMPLATES.DOCUMENT_PASS.body, requiredDocuments:'', requestItems:NOTICE_TEMPLATES.DOCUMENT_PASS.req},
        {id:'김화신_2003-05-12', university:'경북대학교', name:'김화신', birthDate:'2003-05-12', major:'기계공학과', internshipType:'채용연계형', field:'품질', currentStage:'FINAL_PASS', documentStatus:'PASS', finalStatus:'PASS', noticeTitle:NOTICE_TEMPLATES.FINAL_PASS.title, noticeBody:NOTICE_TEMPLATES.FINAL_PASS.body, requiredDocuments:NOTICE_TEMPLATES.FINAL_PASS.docs, requestItems:NOTICE_TEMPLATES.FINAL_PASS.req},
        {id:'이대한_2004-09-02', university:'계명대학교', name:'이대한', birthDate:'2004-09-02', major:'산업공학과', internshipType:'체험형', field:'연구소', currentStage:'DOCUMENT_FAIL', documentStatus:'FAIL', finalStatus:'WAITING', noticeTitle:NOTICE_TEMPLATES.DOCUMENT_FAIL.title, noticeBody:NOTICE_TEMPLATES.DOCUMENT_FAIL.body}
      ];
      localStorage.setItem('HWASHIN_DEMO_APPLICANTS', JSON.stringify(applicants));
      renderTable();
      showToast('데모 데이터를 생성했습니다.');
    }

    function exportCsv(){
      const header = ['university','name','birthDate','phone','email','major','internshipType','field','currentStage','interviewDate','noticeTitle','noticeBody','requiredDocuments','requestItems','memo','updatedAt'];
      const csv = [header.join(',')].concat(applicants.map(a => header.map(k => `"${String(a[k] || '').replace(/"/g,'""')}"`).join(','))).join('\n');
      const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'hwashin_internship_applicants.csv'; a.click();
      URL.revokeObjectURL(url);
    }

    async function importApplicantsFromFile(event){
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if(!file) return;
      try {
        const rows = await readApplicantFile(file);
        const normalized = rows.map(normalizeImportRow).filter(row => row.name && row.birthDate);
        if(!normalized.length) return showToast('불러올 지원자 데이터가 없습니다.');
        if(API_ENDPOINT && ADMIN_KEY){
          const res = await callApi({action:'bulkUpsert', key:ADMIN_KEY, payloads: normalized}, 'POST');
          if(!res.ok) return showToast(res.message || '파일 저장에 실패했습니다.');
          showToast(`${res.count || normalized.length}명을 Google Sheets에 저장했습니다.`);
          await loadApplicants();
        } else {
          normalized.forEach(item => {
            const idx = applicants.findIndex(a => a.id === item.id);
            if(idx >= 0) applicants[idx] = {...applicants[idx], ...item};
            else applicants.push(item);
          });
          localStorage.setItem('HWASHIN_DEMO_APPLICANTS', JSON.stringify(applicants));
          renderTable();
          showToast(`${normalized.length}명을 데모 목록에 반영했습니다.`);
        }
      } catch(error) {
        showToast(error.message || '파일을 불러오지 못했습니다.');
      }
    }
    function readApplicantFile(file){
      const lower = file.name.toLowerCase();
      if(lower.endsWith('.csv')){
        return file.text().then(text => csvToObjects(text));
      }
      if(!window.XLSX) throw new Error('XLSX 파서가 로드되지 않았습니다. 잠시 후 다시 시도해 주세요.');
      return file.arrayBuffer().then(buffer => {
        const workbook = XLSX.read(buffer, {type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        return XLSX.utils.sheet_to_json(sheet, {defval:''});
      });
    }
    function csvToObjects(text){
      const rows = parseCsv(text.replace(/^\uFEFF/, ''));
      if(rows.length < 2) return [];
      const headers = rows[0].map(h => String(h || '').trim());
      return rows.slice(1).filter(row => row.some(Boolean)).map(row => {
        const obj = {};
        headers.forEach((header, index) => obj[header] = row[index] || '');
        return obj;
      });
    }
    function parseCsv(text){
      const rows = [];
      let row = [], value = '', quote = false;
      for(let i = 0; i < text.length; i++){
        const ch = text[i], next = text[i + 1];
        if(ch === '"' && quote && next === '"'){ value += '"'; i++; continue; }
        if(ch === '"'){ quote = !quote; continue; }
        if(ch === ',' && !quote){ row.push(value); value = ''; continue; }
        if((ch === '\n' || ch === '\r') && !quote){
          if(ch === '\r' && next === '\n') i++;
          row.push(value); rows.push(row); row = []; value = ''; continue;
        }
        value += ch;
      }
      row.push(value);
      if(row.some(cell => cell !== '')) rows.push(row);
      return rows;
    }
    function pick(row, keys){
      for(const key of keys){
        if(row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') return String(row[key]).trim();
      }
      return '';
    }
    function normalizeImportRow(row){
      const type = normalizeInternshipType(pick(row, ['internshipType','인턴유형','인턴 유형','유형','모집유형','모집 유형']));
      const fallbackField = type === '체험형' ? '연구소' : '';
      const item = {
        university: pick(row, ['university','대학교','대학','학교']),
        name: pick(row, ['name','이름','성명']),
        birthDate: normalizeBirth(pick(row, ['birthDate','생년월일','생년월일(YYYY-MM-DD)','birth','birthday'])),
        phone: pick(row, ['phone','연락처','전화번호','휴대폰']),
        email: pick(row, ['email','이메일','메일']),
        major: pick(row, ['major','전공','학과']),
        internshipType: type,
        field: pick(row, ['field','지원분야','지원 분야','직무']) || fallbackField,
        currentStage: normalizeStage(pick(row, ['currentStage','전형단계','전형 단계','결과','status'])),
        interviewDate: pick(row, ['interviewDate','면접일자','면접 일자','면접일시']),
        noticeTitle: pick(row, ['noticeTitle','안내문제목','안내문 제목']),
        noticeBody: pick(row, ['noticeBody','안내문본문','안내문 본문']),
        requiredDocuments: pick(row, ['requiredDocuments','제출서류','제출 서류']),
        requestItems: pick(row, ['requestItems','요청사항','제출기한','제출 기한']),
        memo: pick(row, ['memo','메모','담당자메모'])
      };
      if(!FIELD_OPTIONS[item.internshipType].includes(item.field)) item.field = fallbackField || FIELD_OPTIONS[item.internshipType][0];
      item.id = makeId(item.name, item.birthDate);
      item.updatedAt = new Date().toISOString();
      item.documentStatus = item.currentStage === 'DOCUMENT_PASS' || item.currentStage === 'FINAL_PASS' || item.currentStage === 'FINAL_FAIL' ? 'PASS' :
                            item.currentStage === 'DOCUMENT_FAIL' ? 'FAIL' : 'WAITING';
      item.finalStatus = item.currentStage === 'FINAL_PASS' ? 'PASS' :
                         item.currentStage === 'FINAL_FAIL' ? 'FAIL' : 'WAITING';
      const template = NOTICE_TEMPLATES[item.currentStage] || NOTICE_TEMPLATES.REVIEWING;
      item.noticeTitle = item.noticeTitle || template.title;
      item.noticeBody = item.noticeBody || template.body;
      item.requiredDocuments = item.requiredDocuments || template.docs;
      item.requestItems = item.requestItems || template.req;
      return item;
    }

    async function callApi(params, method = 'GET'){
      const options = {headers:{'Accept':'application/json'}};
      let url = API_ENDPOINT;
      if(method === 'GET'){
        url += '?' + new URLSearchParams({...params, t: Date.now()}).toString();
      } else {
        options.method = method;
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(params);
      }
      const res = await fetch(url, options);
      if(!res.ok) throw new Error('API 호출 실패');
      return res.json();
    }

    function stageBadge(stage){
      const map = {
        REVIEWING:['검토 중','amber'], DOCUMENT_PASS:['서류합격','green'], DOCUMENT_FAIL:['서류불합격','red'],
        FINAL_PASS:['최종합격','green'], FINAL_FAIL:['최종불합격','red']
      };
      const m = map[stage] || ['검토 중','amber'];
      return `<span class="badge ${m[1]}" style="margin:0">${m[0]}</span>`;
    }
    function showToast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 2600);
    }
    function escapeHtml(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
    function escapeJs(v){ return String(v ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
  </script>
